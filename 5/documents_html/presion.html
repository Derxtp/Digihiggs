<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Presión</title>
    <link rel="shortcut icon" href="/images/digihiggs.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/stylepages.css">
</head>
<body>
    <div class="container">

        <nav>
            <button onclick="window.location.href='dashboard.html'" class="btn-nav">Regresar</button>
            <button id="btnConfig" class="btn-nav">Parámetros</button>
            <button id="btnFormulas" class="btn-nav">Fórmulas</button>
        </nav>

        <h1>Conversor de Presión</h1>

        <div class="precision-control">
            <label for="decimales">Precisión (0-8 decimales): </label>
            <input type="number" id="decimales" min="0" max="8" value="2">
        </div>

        <div class="converter-grid">
            <div class="input-group">
                <label>Pascal (Pa)</label>
                <input type="number" id="pascal" placeholder="0">
            </div>
            <div class="input-group">
                <label>Megapascal (MPa)</label>
                <input type="number" id="megapascal" placeholder="0">
            </div>
            <div class="input-group">
                <label>Kilopascal (kPa)</label>
                <input type="number" id="kilopascal" placeholder="0">
            </div>
            <div class="input-group">
                <label>Kilogramo por cm² (kg/cm²)</label>
                <input type="number" id="kilogramoCentimetroCuadrado" placeholder="0">
            </div>
            <div class="input-group">
                <label>Atmósfera Estándar (atm)</label>
                <input type="number" id="atmosferaEstandar" placeholder="0">
            </div>
            <div class="input-group">
                <label>Bar (bar)</label>
                <input type="number" id="bar" placeholder="0">
            </div>
            <div class="input-group">
                <label>Milímetro de Mercurio (mmHg)</label>
                <input type="number" id="milimetroMercurio" placeholder="0">
            </div>
            <div class="input-group">
                <label>Libra por Pulgada Cuadrada (psi)</label>
                <input type="number" id="libraPulgadaCuadrada" placeholder="0">
            </div>
            <div class="input-group">
                <label>Columna de Agua (mmH₂O)</label>
                <input type="number" id="columnaAgua" placeholder="0">
            </div>
            <div class="input-group">
                <label>Torricelli (Torr)</label>
                <input type="number" id="torricelli" placeholder="0">
            </div>
        </div>

        <section class="procedimiento">
            <h3>Sustitución y Desarrollo:</h3>
            <div id="pasos" class="pasos-container">
                Introduzca un valor para ver el procedimiento detallado.
            </div>
        </section>
    </div>

    <div id="modalJSON" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Configuración de Constantes (JSON)</h2>
            <textarea id="jsonEditor" rows="12" style="width:100%; font-family: monospace;"></textarea>
            <button id="saveJSON" class="btn-save">Guardar Cambios</button>
        </div>
    </div>

    <div id="modalFormulas" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Fórmulas de Conversión (Base: Pascal)</h2>
            <div id="listaFormulas"></div>
        </div>
    </div>

    <script src="/js/converterpressure.js"></script>
</body>
</html>
