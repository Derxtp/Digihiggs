<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Torque</title>
    <link rel="shortcut icon" href="/images/digihiggs.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/stylepages.css">
</head>
<body>
    <div class="container">

        <nav>
            <button onclick="window.location.href='dashboard.html'" class="btn-nav">Regresar</button>
            <button id="btnConfig" class="btn-nav">Parámetros</button>
            <button id="btnFormulas" class="btn-nav">Fórmulas</button>
        </nav>

        <h1>Conversor de Magnitudes de Torque</h1>

        <div class="precision-control">
            <label for="decimales">Precisión (0-8 decimales): </label>
            <input type="number" id="decimales" min="0" max="8" value="2">
        </div>

        <div class="converter-grid">
            <div class="input-group"><label>Newton-metro (N·m)</label><input type="number" id="newtonMetro" placeholder="0"></div>
            <div class="input-group"><label>Kilonewton-metro (kN·m)</label><input type="number" id="kilonewtonMetro" placeholder="0"></div>
            <div class="input-group"><label>Milinewton-metro (mN·m)</label><input type="number" id="milinewtonMetro" placeholder="0"></div>
            <div class="input-group"><label>Newton-centímetro (N·cm)</label><input type="number" id="newtonCentimetro" placeholder="0"></div>
            <div class="input-group"><label>Newton-milímetro (N·mm)</label><input type="number" id="newtonMilimetro" placeholder="0"></div>
            <div class="input-group"><label>Kilogramo-fuerza metro (kgf·m)</label><input type="number" id="kilogramoFuerzaMetro" placeholder="0"></div>
            <div class="input-group"><label>Gramo-fuerza centímetro (gf·cm)</label><input type="number" id="gramoFuerzaCentimetro" placeholder="0"></div>
            <div class="input-group"><label>Libra-fuerza pie (lbf·ft)</label><input type="number" id="libraFuerzaPie" placeholder="0"></div>
            <div class="input-group"><label>Libra-fuerza pulgada (lbf·in)</label><input type="number" id="libraFuerzaPulgada" placeholder="0"></div>
            <div class="input-group"><label>Onza-fuerza pulgada (ozf·in)</label><input type="number" id="onzaFuerzaPulgada" placeholder="0"></div>
        </div>

        <section class="procedimiento">
            <h3>Sustitución y Desarrollo:</h3>
            <div id="pasos" class="pasos-container">
                Introduzca un valor para ver el procedimiento matemático detallado.
            </div>
        </section>
    </div>

    <div id="modalJSON" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Configuración de Constantes (JSON)</h2>
            <textarea id="jsonEditor" rows="15" style="width:100%; font-family: monospace;"></textarea>
            <button id="saveJSON" class="btn-save">Guardar Cambios</button>
        </div>
    </div>

    <div id="modalFormulas" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Fórmulas de Torque (Base: Newton-metro)</h2>
            <div id="listaFormulas"></div>
        </div>
    </div>

    <script src="/js/convertertorque.js"></script>
</body>
</html>
