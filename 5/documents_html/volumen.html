<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Volumen</title>
    <link rel="shortcut icon" href="/images/digihiggs.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/stylepages.css">
</head>
<body>
    <div class="container">

        <nav>
            <button onclick="window.location.href='dashboard.html'" class="btn-nav">Regresar</button>
            <button id="btnConfig" class="btn-nav">Parámetros</button>
            <button id="btnFormulas" class="btn-nav">Fórmulas</button>
        </nav>

        <h1>Conversor de Volumen</h1>

        <div class="precision-control">
            <label for="decimales">Precisión (0-8 decimales): </label>
            <input type="number" id="decimales" min="0" max="8" value="2">
        </div>

        <div class="converter-grid">
            <div class="input-group"><label>Metro Cúbico (m³)</label><input type="number" id="metroCubico" placeholder="0"></div>
            <div class="input-group"><label>Centímetro Cúbico (cm³)</label><input type="number" id="centimetroCubico" placeholder="0"></div>
            <div class="input-group"><label>Decímetro Cúbico (dm³)</label><input type="number" id="decimetroCubico" placeholder="0"></div>
            <div class="input-group"><label>Litro (L)</label><input type="number" id="litro" placeholder="0"></div>
            <div class="input-group"><label>Mililitro (mL)</label><input type="number" id="mililitro" placeholder="0"></div>
            <div class="input-group"><label>Pie Cúbico (ft³)</label><input type="number" id="pieCubico" placeholder="0"></div>
            <div class="input-group"><label>Yarda Cúbica (yd³)</label><input type="number" id="yardaCubica" placeholder="0"></div>
            <div class="input-group"><label>Pulgada Cúbica (in³)</label><input type="number" id="pulgadaCubica" placeholder="0"></div>

            <div class="input-group"><label>Barril US (bbl)</label><input type="number" id="barrilUS" placeholder="0"></div>
            <div class="input-group"><label>Galón US (gal)</label><input type="number" id="galonUS" placeholder="0"></div>
            <div class="input-group"><label>Cuarto US (qt)</label><input type="number" id="cuartoUS" placeholder="0"></div>
            <div class="input-group"><label>Pinta US (pt)</label><input type="number" id="pintaUS" placeholder="0"></div>
            <div class="input-group"><label>Taza US (cup)</label><input type="number" id="tazaUS" placeholder="0"></div>
            <div class="input-group"><label>Onza Líquida US (fl oz)</label><input type="number" id="onzaLiquidaUS" placeholder="0"></div>
            <div class="input-group"><label>Cucharada US (tbsp)</label><input type="number" id="cucharadaUS" placeholder="0"></div>
            <div class="input-group"><label>Cucharadita US (tsp)</label><input type="number" id="cucharaditaUS" placeholder="0"></div>

            <div class="input-group"><label>Barril Imperial (UK bbl)</label><input type="number" id="barrilImperial" placeholder="0"></div>
            <div class="input-group"><label>Galón Imperial (UK gal)</label><input type="number" id="galonImperial" placeholder="0"></div>
            <div class="input-group"><label>Cuarto Imperial (UK qt)</label><input type="number" id="cuartoImperial" placeholder="0"></div>
            <div class="input-group"><label>Pinta Imperial (UK pt)</label><input type="number" id="pintaImperial" placeholder="0"></div>
            <div class="input-group"><label>Taza Imperial (UK cup)</label><input type="number" id="tazaImperial" placeholder="0"></div>
            <div class="input-group"><label>Onza Líq. Imperial (UK fl oz)</label><input type="number" id="onzaLiquidaImperial" placeholder="0"></div>
            <div class="input-group"><label>Cucharada Imperial (UK tbsp)</label><input type="number" id="cucharadaImperial" placeholder="0"></div>
            <div class="input-group"><label>Cucharadita Imperial (UK tsp)</label><input type="number" id="cucharaditaImperial" placeholder="0"></div>

            <div class="input-group"><label>Go Japonés (合)</label><input type="number" id="goJapones" placeholder="0"></div>
            <div class="input-group"><label>Shō Japonés (升)</label><input type="number" id="shoJapones" placeholder="0"></div>
            <div class="input-group"><label>To Japonés (斗)</label><input type="number" id="toJapones" placeholder="0"></div>
            <div class="input-group"><label>Koku Japonés (石)</label><input type="number" id="kokuJapones" placeholder="0"></div>
        </div>

        <section class="procedimiento">
            <h3>Sustitución y Desarrollo:</h3>
            <div id="pasos" class="pasos-container">
                Introduzca un valor para ver el procedimiento detallado.
            </div>
        </section>
    </div>

    <div id="modalJSON" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Configuración de Constantes (JSON)</h2>
            <textarea id="jsonEditor" rows="15" style="width:100%; font-family: monospace;"></textarea>
            <button id="saveJSON" class="btn-save">Guardar Cambios</button>
        </div>
    </div>

    <div id="modalFormulas" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Fórmulas de Conversión (Base: m³)</h2>
            <div id="listaFormulas"></div>
        </div>
    </div>

    <script src="/js/convertervol.js"></script>
</body>
</html>
