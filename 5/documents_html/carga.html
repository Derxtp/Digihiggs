<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Carga Eléctrica</title>
    <link rel="shortcut icon" href="/images/digihiggs.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/stylepages.css">
</head>
<body>
    <div class="container">

        <nav>
            <button onclick="window.location.href='dashboard.html'" class="btn-nav">Regresar</button>
            <button id="btnConfig" class="btn-nav">Parámetros</button>
            <button id="btnFormulas" class="btn-nav">Fórmulas</button>
        </nav>

        <h1>Conversor de Carga Eléctrica</h1>

        <div class="precision-control">
            <label for="decimales">Precisión (0-8 decimales): </label>
            <input type="number" id="decimales" min="0" max="8" value="2">
        </div>

        <div class="converter-grid">
            <div class="input-group"><label>Picocoulomb (pC)</label><input type="number" id="picocoulomb" placeholder="0"></div>
            <div class="input-group"><label>Nanocoulomb (nC)</label><input type="number" id="nanocoulomb" placeholder="0"></div>
            <div class="input-group"><label>Microcoulomb (µC)</label><input type="number" id="microcoulomb" placeholder="0"></div>
            <div class="input-group"><label>Milicoulomb (mC)</label><input type="number" id="milicoulomb" placeholder="0"></div>
            <div class="input-group"><label>Coulomb (C)</label><input type="number" id="coulomb" placeholder="0"></div>
            <div class="input-group"><label>Kilocoulomb (kC)</label><input type="number" id="kilocoulomb" placeholder="0"></div>
            <div class="input-group"><label>Megacoulomb (MC)</label><input type="number" id="megacoulomb" placeholder="0"></div>

            <div class="input-group"><label>Amperio-segundo (A·s)</label><input type="number" id="amperioSegundo" placeholder="0"></div>
            <div class="input-group"><label>Amperio-minuto (A·min)</label><input type="number" id="amperioMinuto" placeholder="0"></div>
            <div class="input-group"><label>Miliamperio-hora (mAh)</label><input type="number" id="miliamperioHora" placeholder="0"></div>
            <div class="input-group"><label>Amperio-hora (Ah)</label><input type="number" id="amperioHora" placeholder="0"></div>

            <div class="input-group"><label>Carga elemental (e)</label><input type="number" id="cargaElemental" placeholder="0"></div>
            <div class="input-group"><label>Faraday (F)</label><input type="number" id="faraday" placeholder="0"></div>
        </div>

        <section class="procedimiento">
            <h3>Sustitución y Desarrollo:</h3>
            <div id="pasos" class="pasos-container">
                Introduzca un valor para ver el procedimiento matemático detallado.
            </div>
        </section>
    </div>

    <div id="modalJSON" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Configuración de Constantes (JSON)</h2>
            <textarea id="jsonEditor" rows="15" style="width:100%; font-family: monospace;"></textarea>
            <button id="saveJSON" class="btn-save">Guardar Cambios</button>
        </div>
    </div>

    <div id="modalFormulas" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Fórmulas e Identidades Electrodinámicas (Base: Coulomb)</h2>
            <div id="listaFormulas"></div>
        </div>
    </div>

    <script src="/js/convertercharge.js"></script>
</body>
</html>
