<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Fuerza</title>
    <link rel="shortcut icon" href="/images/digihiggs.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/stylepages.css">
</head>
<body>
    <div class="container">

        <nav>
            <button onclick="window.location.href='dashboard.html'" class="btn-nav">Regresar</button>
            <button id="btnConfig" class="btn-nav">Parámetros</button>
            <button id="btnFormulas" class="btn-nav">Fórmulas</button>
        </nav>

        <h1>Conversor de Fuerza</h1>

        <div class="precision-control">
            <label for="decimales">Precisión (0-8 decimales): </label>
            <input type="number" id="decimales" min="0" max="8" value="2">
        </div>

        <div class="converter-grid">
            <div class="input-group">
                <label>Newton (N)</label>
                <input type="number" id="newton" placeholder="0">
            </div>
            <div class="input-group">
                <label>Kilonewton (kN)</label>
                <input type="number" id="kilonewton" placeholder="0">
            </div>
            <div class="input-group">
                <label>Meganewton (MN)</label>
                <input type="number" id="meganewton" placeholder="0">
            </div>
            <div class="input-group">
                <label>Kilogramo-fuerza (kgf)</label>
                <input type="number" id="kilogramoFuerza" placeholder="0">
            </div>
            <div class="input-group">
                <label>Kilopondio (kp)</label>
                <input type="number" id="kilopondio" placeholder="0">
            </div>
            <div class="input-group">
                <label>Libra-fuerza (lbf)</label>
                <input type="number" id="libraFuerza" placeholder="0">
            </div>
            <div class="input-group">
                <label>Dina (dyn)</label>
                <input type="number" id="dina" placeholder="0">
            </div>
        </div>

        <section class="procedimiento">
            <h3>Sustitución y Desarrollo:</h3>
            <div id="pasos" class="pasos-container">
                Introduzca un valor para ver el procedimiento detallado.
            </div>
        </section>
    </div>

    <div id="modalJSON" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Configuración de Constantes (JSON)</h2>
            <textarea id="jsonEditor" rows="12" style="width:100%; font-family: monospace;"></textarea>
            <button id="saveJSON" class="btn-save">Guardar Cambios</button>
        </div>
    </div>

    <div id="modalFormulas" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Fórmulas de Conversión (Base: Newton)</h2>
            <div id="listaFormulas"></div>
        </div>
    </div>

    <script src="/js/converterfuerza.js"></script>
</body>
</html>
