<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Velocidad Angular</title>
    <link rel="shortcut icon" href="/images/digihiggs.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/stylepages.css">
</head>
<body>
    <div class="container">

        <nav>
            <button onclick="window.location.href='dashboard.html'" class="btn-nav">Regresar</button>
            <button id="btnConfig" class="btn-nav">Parámetros</button>
            <button id="btnFormulas" class="btn-nav">Fórmulas</button>
        </nav>

        <h1>Conversor de Velocidad Angular y Ritmo</h1>

        <div class="precision-control">
            <label for="decimales">Precisión (0-8 decimales): </label>
            <input type="number" id="decimales" min="0" max="8" value="2">
        </div>

        <div class="converter-grid">
            <div class="input-group">
                <label>Radianes por segundo (rad/s)</label>
                <input type="number" id="radSeg" placeholder="0">
            </div>
            <div class="input-group">
                <label>Radianes por minuto (rad/min)</label>
                <input type="number" id="radMin" placeholder="0">
            </div>
            <div class="input-group">
                <label>Radianes por hora (rad/h)</label>
                <input type="number" id="radHora" placeholder="0">
            </div>
            <div class="input-group">
                <label>Radianes por día (rad/d)</label>
                <input type="number" id="radDia" placeholder="0">
            </div>
            <div class="input-group">
                <label>Grados por segundo (°/s)</label>
                <input type="number" id="degSeg" placeholder="0">
            </div>
            <div class="input-group">
                <label>Grados por minuto (°/min)</label>
                <input type="number" id="degMin" placeholder="0">
            </div>
            <div class="input-group">
                <label>Grados por hora (°/h)</label>
                <input type="number" id="degHora" placeholder="0">
            </div>
            <div class="input-group">
                <label>Grados por día (°/d)</label>
                <input type="number" id="degDia" placeholder="0">
            </div>
            <div class="input-group">
                <label>Revoluciones por minuto (RPM)</label>
                <input type="number" id="rpm" placeholder="0">
            </div>
            <div class="input-group">
                <label>Beats por minuto (BPM)</label>
                <input type="number" id="bpm" placeholder="0">
            </div>
        </div>

        <section class="procedimiento">
            <h3>Sustitución y Desarrollo:</h3>
            <div id="pasos" class="pasos-container">
                Introduzca un valor para ver el procedimiento analítico en tiempo real.
            </div>
        </section>
    </div>

    <div id="modalJSON" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Configuración de Constantes (JSON)</h2>
            <textarea id="jsonEditor" rows="14" style="width:100%; font-family: monospace;"></textarea>
            <button id="saveJSON" class="btn-save">Guardar Cambios</button>
        </div>
    </div>

    <div id="modalFormulas" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Fórmulas e Identidades Angulares (Base: rad/s)</h2>
            <div id="listaFormulas"></div>
        </div>
    </div>

    <script src="/js/converterangular.js"></script>
</body>
</html>
