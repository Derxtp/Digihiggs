<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Frecuencia y Periodo</title>
    <link rel="shortcut icon" href="/images/digihiggs.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/stylepages.css">
</head>
<body>
    <div class="container">

        <nav>
            <button onclick="window.location.href='dashboard.html'" class="btn-nav">Regresar</button>
            <button id="btnConfig" class="btn-nav">Parámetros</button>
            <button id="btnFormulas" class="btn-nav">Fórmulas</button>
        </nav>

        <h1>Conversor de Frecuencia y Periodo</h1>

        <div class="precision-control">
            <label for="decimales">Precisión (0-8 decimales): </label>
            <input type="number" id="decimales" min="0" max="8" value="2">
        </div>

        <div class="converter-grid">
            <div class="input-group"><label>Nanohertz (nHz)</label><input type="number" id="nanohertz" placeholder="0"></div>
            <div class="input-group"><label>Microhertz (µHz)</label><input type="number" id="microhertz" placeholder="0"></div>
            <div class="input-group"><label>Milihertz (mHz)</label><input type="number" id="milihertz" placeholder="0"></div>
            <div class="input-group"><label>Hertz (Hz)</label><input type="number" id="hertz" placeholder="0"></div>
            <div class="input-group"><label>Kilohertz (kHz)</label><input type="number" id="kilohertz" placeholder="0"></div>
            <div class="input-group"><label>Megahertz (MHz)</label><input type="number" id="megahertz" placeholder="0"></div>
            <div class="input-group"><label>Gigahertz (GHz)</label><input type="number" id="gigahertz" placeholder="0"></div>
            <div class="input-group"><label>Terahertz (THz)</label><input type="number" id="terahertz" placeholder="0"></div>
            <div class="input-group"><label>Ciclos por segundo (cps)</label><input type="number" id="ciclosSegundo" placeholder="0"></div>

            <div class="input-group"><label>Segundos por ciclo (s)</label><input type="number" id="segundosCiclo" placeholder="0"></div>
            <div class="input-group"><label>Milisegundos por ciclo (ms)</label><input type="number" id="milisegundosCiclo" placeholder="0"></div>
            <div class="input-group"><label>Microsegundos por ciclo (µs)</label><input type="number" id="microsegundosCiclo" placeholder="0"></div>
            <div class="input-group"><label>Nanosegundos por ciclo (ns)</label><input type="number" id="nanosegundosCiclo" placeholder="0"></div>
        </div>

        <section class="procedimiento">
            <h3>Sustitución y Desarrollo:</h3>
            <div id="pasos" class="pasos-container">
                Introduzca un valor para ver el procedimiento matemático en tiempo real.
            </div>
        </section>
    </div>

    <div id="modalJSON" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Configuración de Constantes (JSON)</h2>
            <textarea id="jsonEditor" rows="15" style="width:100%; font-family: monospace;"></textarea>
            <button id="saveJSON" class="btn-save">Guardar Cambios</button>
        </div>
    </div>

    <div id="modalFormulas" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Fórmulas y Relaciones Inversas (Base: Hz)</h2>
            <div id="listaFormulas"></div>
        </div>
    </div>

    <script src="/js/converterwave.js"></script>
</body>
</html>
