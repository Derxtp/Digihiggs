<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Energía</title>
    <link rel="shortcut icon" href="/images/digihiggs.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/stylepages.css">
</head>
<body>
    <div class="container">

        <nav>
            <button onclick="window.location.href='dashboard.html'" class="btn-nav">Regresar</button>
            <button id="btnConfig" class="btn-nav">Parámetros</button>
            <button id="btnFormulas" class="btn-nav">Fórmulas</button>
        </nav>

        <h1>Conversor de Energía</h1>

        <div class="precision-control">
            <label for="decimales">Precisión (0-8 decimales): </label>
            <input type="number" id="decimales" min="0" max="8" value="2">
        </div>

        <div class="converter-grid">
            <div class="input-group"><label>Joule (J)</label><input type="number" id="joule" placeholder="0"></div>
            <div class="input-group"><label>Kilojoule (kJ)</label><input type="number" id="kilojoule" placeholder="0"></div>
            <div class="input-group"><label>Megajoule (MJ)</label><input type="number" id="megajoule" placeholder="0"></div>
            <div class="input-group"><label>Kilocaloría (kcal)</label><input type="number" id="kilocaloria" placeholder="0"></div>
            <div class="input-group"><label>Electronvoltio (eV)</label><input type="number" id="electronvoltio" placeholder="0"></div>
            <div class="input-group"><label>Vatio-hora (Wh)</label><input type="number" id="vatioHora" placeholder="0"></div>
            <div class="input-group"><label>Kilovatio-hora (kWh)</label><input type="number" id="kilovatioHora" placeholder="0"></div>
            <div class="input-group"><label>Vatio-segundo (Ws)</label><input type="number" id="vatioSegundo" placeholder="0"></div>
            <div class="input-group"><label>Caloría Nutricional (Cal)</label><input type="number" id="caloriaNutricional" placeholder="0"></div>
            <div class="input-group"><label>Caloría Térmica (cal)</label><input type="number" id="caloriaTermica" placeholder="0"></div>
            <div class="input-group"><label>Unidad Térmica Británica (BTU)</label><input type="number" id="unidadTermicaBritanica" placeholder="0"></div>
            <div class="input-group"><label>Ergios (erg)</label><input type="number" id="ergio" placeholder="0"></div>
            <div class="input-group"><label>Termia Americana (therm)</label><input type="number" id="termiaAmericana" placeholder="0"></div>
            <div class="input-group"><label>Pie-libra fuerza (ft·lbf)</label><input type="number" id="pieLibraFuerza" placeholder="0"></div>
        </div>

        <section class="procedimiento">
            <h3>Sustitución y Desarrollo:</h3>
            <div id="pasos" class="pasos-container">
                Introduzca un valor para ver el procedimiento detallado.
            </div>
        </section>
    </div>

    <div id="modalJSON" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Configuración de Constantes (JSON)</h2>
            <textarea id="jsonEditor" rows="14" style="width:100%; font-family: monospace;"></textarea>
            <button id="saveJSON" class="btn-save">Guardar Cambios</button>
        </div>
    </div>

    <div id="modalFormulas" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Fórmulas de Conversión (Base: Joule)</h2>
            <div id="listaFormulas"></div>
        </div>
    </div>

    <script src="/js/converterenergy.js"></script>
</body>
</html>
