<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Campo Eléctrico</title>
    <link rel="shortcut icon" href="/images/digihiggs.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/stylepages.css">
</head>
<body>
    <div class="container">

        <nav>
            <button onclick="window.location.href='dashboard.html'" class="btn-nav">Regresar</button>
            <button id="btnConfig" class="btn-nav">Parámetros</button>
            <button id="btnFormulas" class="btn-nav">Fórmulas</button>
        </nav>

        <h1>Conversor de Campo Eléctrico</h1>

        <div class="precision-control">
            <label for="decimales">Precisión (0-8 decimales): </label>
            <input type="number" id="decimales" min="0" max="8" value="2">
        </div>

        <div class="converter-grid">
            <div class="input-group"><label>Newton por Coulomb (N/C)</label><input type="number" id="newtonCoulomb" placeholder="0"></div>
            <div class="input-group"><label>Kilonewton por Coulomb (kN/C)</label><input type="number" id="kilonewtonCoulomb" placeholder="0"></div>
            <div class="input-group"><label>Meganewton por Coulomb (MN/C)</label><input type="number" id="meganewtonCoulomb" placeholder="0"></div>
            <div class="input-group"><label>Voltio por metro (V/m)</label><input type="number" id="voltioMetro" placeholder="0"></div>
            <div class="input-group"><label>Voltio por centímetro (V/cm)</label><input type="number" id="voltioCentimetro" placeholder="0"></div>
            <div class="input-group"><label>Voltio por milímetro (V/mm)</label><input type="number" id="voltioMilimetro" placeholder="0"></div>
            <div class="input-group"><label>Kilovoltio por metro (kV/m)</label><input type="number" id="kilovoltioMetro" placeholder="0"></div>
            <div class="input-group"><label>Kilovoltio por centímetro (kV/cm)</label><input type="number" id="kilovoltioCentimetro" placeholder="0"></div>
            <div class="input-group"><label>Megavoltio por metro (MV/m)</label><input type="number" id="megavoltioMetro" placeholder="0"></div>
        </div>

        <section class="procedimiento">
            <h3>Sustitución y Desarrollo:</h3>
            <div id="pasos" class="pasos-container">
                Introduzca un valor para ver el procedimiento matemático detallado.
            </div>
        </section>
    </div>

    <div id="modalJSON" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Configuración de Constantes (JSON)</h2>
            <textarea id="jsonEditor" rows="14" style="width:100%; font-family: monospace;"></textarea>
            <button id="saveJSON" class="btn-save">Guardar Cambios</button>
        </div>
    </div>

    <div id="modalFormulas" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Fórmulas de Campo Eléctrico (Base: N/C o V/m)</h2>
            <div id="listaFormulas"></div>
        </div>
    </div>

    <script src="/js/converterelectric.js"></script>
</body>
</html>
