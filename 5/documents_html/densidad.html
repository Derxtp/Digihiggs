<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Densidad</title>
    <link rel="shortcut icon" href="/images/digihiggs.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/stylepages.css">
</head>
<body>
    <div class="container">

        <nav>
            <button onclick="window.location.href='dashboard.html'" class="btn-nav">Regresar</button>
            <button id="btnConfig" class="btn-nav">Parámetros</button>
            <button id="btnFormulas" class="btn-nav">Fórmulas</button>
        </nav>

        <h1>Conversor de Densidad</h1>

        <div class="precision-control">
            <label for="decimales">Precisión (0-8 decimales): </label>
            <input type="number" id="decimales" min="0" max="8" value="2">
        </div>

        <div class="converter-grid">
            <div class="input-group">
                <label>Kilogramo por Metro Cúbico (kg/m³)</label>
                <input type="number" id="kilogramoMetroCubico" placeholder="0">
            </div>
            <div class="input-group">
                <label>Gramo por Centímetro Cúbico (g/cm³)</label>
                <input type="number" id="gramoCentimetroCubico" placeholder="0">
            </div>
            <div class="input-group">
                <label>Gramo por Mililitro (g/mL)</label>
                <input type="number" id="gramoMililitro" placeholder="0">
            </div>
            <div class="input-group">
                <label>Gramo por Litro (g/L)</label>
                <input type="number" id="gramoLitro" placeholder="0">
            </div>
            <div class="input-group">
                <label>Onza (Av.) por Galón US (oz/gal US)</label>
                <input type="number" id="onzaGalonUS" placeholder="0">
            </div>
            <div class="input-group">
                <label>Onza (Av.) por Galón UK (oz/gal UK)</label>
                <input type="number" id="onzaGalonUK" placeholder="0">
            </div>
            <div class="input-group">
                <label>Onza (Av.) por Pulgada Cúbica (oz/in³)</label>
                <input type="number" id="onzaPulgadaCubica" placeholder="0">
            </div>
            <div class="input-group">
                <label>Libra por Pie Cúbico (lb/ft³)</label>
                <input type="number" id="libraPieCubico" placeholder="0">
            </div>
            <div class="input-group">
                <label>Libra por Pulgada Cúbica (lb/in³)</label>
                <input type="number" id="libraPulgadaCubica" placeholder="0">
            </div>
            <div class="input-group">
                <label>Libra por Galón US (lb/gal)</label>
                <input type="number" id="libraGalon" placeholder="0">
            </div>
        </div>

        <section class="procedimiento">
            <h3>Sustitución y Desarrollo:</h3>
            <div id="pasos" class="pasos-container">
                Introduzca un valor para ver el procedimiento detallado.
            </div>
        </section>
    </div>

    <div id="modalJSON" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Configuración de Constantes (JSON)</h2>
            <textarea id="jsonEditor" rows="12" style="width:100%; font-family: monospace;"></textarea>
            <button id="saveJSON" class="btn-save">Guardar Cambios</button>
        </div>
    </div>

    <div id="modalFormulas" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Fórmulas de Conversión (Base: kg/m³)</h2>
            <div id="listaFormulas"></div>
        </div>
    </div>

    <script src="/js/converterdensity.js"></script>
</body>
</html>
