<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Tiempo</title>
    <link rel="shortcut icon" href="/images/digihiggs.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/stylepages.css">
</head>
<body>
    <div class="container">

        <nav>
            <button onclick="window.location.href='dashboard.html'" class="btn-nav">Regresar</button>
            <button id="btnConfig" class="btn-nav">Parámetros</button>
            <button id="btnFormulas" class="btn-nav">Fórmulas</button>
        </nav>

        <h1>Conversor de Tiempo</h1>

        <div class="precision-control">
            <label for="decimales">Precisión (0-8 decimales): </label>
            <input type="number" id="decimales" min="0" max="8" value="2">
        </div>

        <div class="converter-grid">
            <div class="input-group">
                <label>Segundo (s)</label>
                <input type="number" id="segundo" placeholder="0">
            </div>
            <div class="input-group">
                <label>Milésima de segundo (ms)</label>
                <input type="number" id="milesimaSegundo" placeholder="0">
            </div>
            <div class="input-group">
                <label>Minuto (min)</label>
                <input type="number" id="minuto" placeholder="0">
            </div>
            <div class="input-group">
                <label>Hora (h)</label>
                <input type="number" id="hora" placeholder="0">
            </div>
            <div class="input-group">
                <label>Día (d)</label>
                <input type="number" id="dia" placeholder="0">
            </div>
            <div class="input-group">
                <label>Nanosegundo (ns)</label>
                <input type="number" id="nanosegundo" placeholder="0">
            </div>
            <div class="input-group">
                <label>Microsegundo (µs)</label>
                <input type="number" id="microsegundo" placeholder="0">
            </div>
            <div class="input-group">
                <label>Semana</label>
                <input type="number" id="semana" placeholder="0">
            </div>
            <div class="input-group">
                <label>Mes</label>
                <input type="number" id="mes" placeholder="0">
            </div>
            <div class="input-group">
                <label>Año</label>
                <input type="number" id="ano" placeholder="0">
            </div>
            <div class="input-group">
                <label>Lustro</label>
                <input type="number" id="lustro" placeholder="0">
            </div>
            <div class="input-group">
                <label>Década</label>
                <input type="number" id="decada" placeholder="0">
            </div>
            <div class="input-group">
                <label>Siglo</label>
                <input type="number" id="siglo" placeholder="0">
            </div>
            <div class="input-group">
                <label>Milenio</label>
                <input type="number" id="milenio" placeholder="0">
            </div>
        </div>

        <section class="procedimiento">
            <h3>Sustitución y Desarrollo:</h3>
            <div id="pasos" class="pasos-container">
                Introduzca un valor para ver el procedimiento detallado.
            </div>
        </section>
    </div>

    <div id="modalJSON" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Configuración de Constantes (JSON)</h2>
            <textarea id="jsonEditor" rows="12" style="width:100%"></textarea>
            <button id="saveJSON" class="btn-save">Guardar Cambios</button>
        </div>
    </div>

    <div id="modalFormulas" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Fórmulas de Conversión (Base: Segundo)</h2>
            <div id="listaFormulas"></div>
        </div>
    </div>

    <script src="/js/convertertime.js"></script>
</body>
</html>
