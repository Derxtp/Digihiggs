<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Densidad de Flujo Magnético</title>
    <link rel="shortcut icon" href="/images/digihiggs.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/stylepages.css">
</head>
<body>
    <div class="container">

        <nav>
            <button onclick="window.location.href='dashboard.html'" class="btn-nav">Regresar</button>
            <button id="btnConfig" class="btn-nav">Parámetros</button>
            <button id="btnFormulas" class="btn-nav">Fórmulas</button>
        </nav>

        <h1>Conversor de Densidad de Flujo Magnético</h1>

        <div class="precision-control">
            <label for="decimales">Precisión (0-8 decimales): </label>
            <input type="number" id="decimales" min="0" max="8" value="2">
        </div>

        <div class="converter-grid">
            <div class="input-group"><label>Tesla (T)</label><input type="number" id="tesla" placeholder="0"></div>
            <div class="input-group"><label>Militesla (mT)</label><input type="number" id="militesla" placeholder="0"></div>
            <div class="input-group"><label>Microtesla (µT)</label><input type="number" id="microtesla" placeholder="0"></div>
            <div class="input-group"><label>Nanotesla (nT)</label><input type="number" id="nanotesla" placeholder="0"></div>
            <div class="input-group"><label>Gauss (G)</label><input type="number" id="gauss" placeholder="0"></div>
            <div class="input-group"><label>Gamma (γ)</label><input type="number" id="gamma" placeholder="0"></div>
        </div>

        <section class="procedimiento">
            <h3>Sustitución y Desarrollo:</h3>
            <div id="pasos" class="pasos-container">
                Introduzca un valor para ver el procedimiento matemático detallado.
            </div>
        </section>
    </div>

    <div id="modalJSON" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Configuración de Constantes (JSON)</h2>
            <textarea id="jsonEditor" rows="12" style="width:100%; font-family: monospace;"></textarea>
            <button id="saveJSON" class="btn-save">Guardar Cambios</button>
        </div>
    </div>

    <div id="modalFormulas" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Fórmulas de Inducción Magnética (Base: Tesla)</h2>
            <div id="listaFormulas"></div>
        </div>
    </div>

    <script src="/js/convertermagnetic.js"></script>
</body>
</html>
