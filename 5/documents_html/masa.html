<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Masa</title>
    <link rel="shortcut icon" href="/images/digihiggs.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/stylepages.css">
</head>
<body>
    <div class="container">

        <nav>
            <button onclick="window.location.href='dashboard.html'" class="btn-nav">Regresar</button>
            <button id="btnConfig" class="btn-nav">Parámetros</button>
            <button id="btnFormulas" class="btn-nav">Fórmulas</button>
        </nav>

        <h1>Conversor de Masa</h1>

        <div class="precision-control">
            <label for="decimales">Precisión (0-8 decimales): </label>
            <input type="number" id="decimales" min="0" max="8" value="2">
        </div>

        <div class="converter-grid">
            <div class="input-group">
                <label>Kilogramo (kg)</label>
                <input type="number" id="kilogramo" placeholder="0">
            </div>
            <div class="input-group">
                <label>Gramo (g)</label>
                <input type="number" id="gramo" placeholder="0">
            </div>
            <div class="input-group">
                <label>Miligramo (mg)</label>
                <input type="number" id="miligramo" placeholder="0">
            </div>
            <div class="input-group">
                <label>Microgramo (µg)</label>
                <input type="number" id="microgramo" placeholder="0">
            </div>
            <div class="input-group">
                <label>Tonelada Métrica (t)</label>
                <input type="number" id="toneladaMetrica" placeholder="0">
            </div>
            <div class="input-group">
                <label>Libra (lb)</label>
                <input type="number" id="libra" placeholder="0">
            </div>
            <div class="input-group">
                <label>Onza (oz)</label>
                <input type="number" id="onza" placeholder="0">
            </div>
            <div class="input-group">
                <label>Tonelada Corta (sh tn)</label>
                <input type="number" id="toneladaCorta" placeholder="0">
            </div>
            <div class="input-group">
                <label>Stone (st)</label>
                <input type="number" id="stone" placeholder="0">
            </div>
        </div>

        <section class="procedimiento">
            <h3>Sustitución y Desarrollo:</h3>
            <div id="pasos" class="pasos-container">
                Introduzca un valor para ver el procedimiento detallado.
            </div>
        </section>
    </div>

    <div id="modalJSON" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Configuración de Constantes (JSON)</h2>
            <textarea id="jsonEditor" rows="12" style="width:100%"></textarea>
            <button id="saveJSON" class="btn-save">Guardar Cambios</button>
        </div>
    </div>

    <div id="modalFormulas" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Fórmulas de Conversión (Base: Kilogramo)</h2>
            <div id="listaFormulas"></div>
        </div>
    </div>

    <script src="/js/convertermass.js"></script>
</body>
</html>
