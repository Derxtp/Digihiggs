<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Combustible</title>
    <link rel="shortcut icon" href="/images/digihiggs.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/stylepages.css">
</head>
<body>
    <div class="container">

        <nav>
            <button onclick="window.location.href='dashboard.html'" class="btn-nav">Regresar</button>
            <button id="btnConfig" class="btn-nav">Parámetros</button>
            <button id="btnFormulas" class="btn-nav">Fórmulas</button>
        </nav>

        <h1>Rendimiento y Consumo de Combustible</h1>

        <div class="precision-control">
            <label for="decimales">Precisión (0-8 decimales): </label>
            <input type="number" id="decimales" min="0" max="8" value="2">
        </div>

        <div class="converter-grid">
            <div class="input-group">
                <label>Kilómetro por litro (km/L)</label>
                <input type="number" id="kmLitro" placeholder="0">
            </div>
            <div class="input-group">
                <label>Kilómetro por galón americano</label>
                <input type="number" id="kmGalonUsa" placeholder="0">
            </div>
            <div class="input-group">
                <label>Litro por 10 kilómetros (L/10 km)</label>
                <input type="number" id="litro10km" placeholder="0">
            </div>
            <div class="input-group">
                <label>Litro por 100 kilómetros (L/100 km)</label>
                <input type="number" id="litro100km" placeholder="0">
            </div>
            <div class="input-group">
                <label>Millas por litro</label>
                <input type="number" id="millasLitro" placeholder="0">
            </div>
            <div class="input-group">
                <label>Milla por galón americano (MPG)</label>
                <input type="number" id="mpgUsa" placeholder="0">
            </div>
            <div class="input-group">
                <label>Millas por galón (Imperial)</label>
                <input type="number" id="mpgImperial" placeholder="0">
            </div>
            <div class="input-group">
                <label>Galón por millas americanas</label>
                <input type="number" id="galonMillaUsa" placeholder="0">
            </div>
            <div class="input-group">
                <label>Galón por millas británicas</label>
                <input type="number" id="galonMillaUk" placeholder="0">
            </div>
            <div class="input-group">
                <label>Galones por 100 millas británicas</label>
                <input type="number" id="galon100MillaUk" placeholder="0">
            </div>
        </div>

        <section class="procedimiento">
            <h3>Sustitución y Desarrollo:</h3>
            <div id="pasos" class="pasos-container">
                Introduzca un valor para ver el procedimiento detallado en tiempo real.
            </div>
        </section>
    </div>

    <div id="modalJSON" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Configuración de Constantes (JSON)</h2>
            <textarea id="jsonEditor" rows="14" style="width:100%; font-family: monospace;"></textarea>
            <button id="saveJSON" class="btn-save">Guardar Cambios</button>
        </div>
    </div>

    <div id="modalFormulas" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Fórmulas y Tipo de Relación (Base: km/L)</h2>
            <div id="listaFormulas"></div>
        </div>
    </div>

    <script src="/js/converterfuel.js"></script>
</body>
</html>
