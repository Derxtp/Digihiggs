<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Área</title>
    <link rel="shortcut icon" href="/images/digihiggs.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/stylepages.css">
</head>
<body>
    <div class="container">

        <nav>
            <button onclick="window.location.href='dashboard.html'" class="btn-nav">Regresar</button>
            <button id="btnConfig" class="btn-nav">Parámetros</button>
            <button id="btnFormulas" class="btn-nav">Fórmulas</button>
        </nav>

        <h1>Conversor de Área</h1>

        <div class="precision-control">
            <label for="decimales">Precisión (0-8 decimales): </label>
            <input type="number" id="decimales" min="0" max="8" value="2">
        </div>

        <div class="converter-grid">
            <div class="input-group">
                <label>Metro Cuadrado (m²)</label>
                <input type="number" id="metroCuadrado" placeholder="0">
            </div>
            <div class="input-group">
                <label>Centímetro Cuadrado (cm²)</label>
                <input type="number" id="centimetroCuadrado" placeholder="0">
            </div>
            <div class="input-group">
                <label>Milímetro Cuadrado (mm²)</label>
                <input type="number" id="milimetroCuadrado" placeholder="0">
            </div>
            <div class="input-group">
                <label>Kilómetro Cuadrado (km²)</label>
                <input type="number" id="kilometroCuadrado" placeholder="0">
            </div>
            <div class="input-group">
                <label>Milla Cuadrada (mi²)</label>
                <input type="number" id="millaCuadrada" placeholder="0">
            </div>
            <div class="input-group">
                <label>Yarda Cuadrada (yd²)</label>
                <input type="number" id="yardaCuadrada" placeholder="0">
            </div>
            <div class="input-group">
                <label>Pie Cuadrado (ft²)</label>
                <input type="number" id="pieCuadrada" placeholder="0">
            </div>
            <div class="input-group">
                <label>Pulgada Cuadrada (in²)</label>
                <input type="number" id="pulgadaCuadrada" placeholder="0">
            </div>
            <div class="input-group">
                <label>Hectárea (ha)</label>
                <input type="number" id="hectarea" placeholder="0">
            </div>
            <div class="input-group">
                <label>Acre (ac)</label>
                <input type="number" id="acre" placeholder="0">
            </div>
        </div>

        <section class="procedimiento">
            <h3>Sustitución y Desarrollo:</h3>
            <div id="pasos" class="pasos-container">
                Introduzca un valor para ver el procedimiento detallado.
            </div>
        </section>
    </div>

    <div id="modalJSON" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Configuración de Constantes (JSON)</h2>
            <textarea id="jsonEditor" rows="12" style="width:100%"></textarea>
            <button id="saveJSON" class="btn-save">Guardar Cambios</button>
        </div>
    </div>

    <div id="modalFormulas" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Fórmulas de Conversión (Base: m²)</h2>
            <div id="listaFormulas"></div>
        </div>
    </div>

    <script src="/js/converterarea.js"></script>
</body>
</html>
